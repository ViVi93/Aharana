apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.vivi.aharana'
    compileSdk 35

    buildFeatures {
        dataBinding = false
    }

    // Populated only when the release signing properties are supplied (CI passes
    // them from repository secrets). When they are absent we must not attach a
    // signing config at all: referencing a storeFile-less config makes
    // packageRelease fail with 'SigningConfig "release" is missing required
    // property "storeFile"' instead of producing an unsigned APK.
    def hasReleaseSigning = project.hasProperty('SIGNING_KEY_STORE_PATH') &&
            project.hasProperty('SIGNING_KEY_ALIAS') &&
            project.hasProperty('SIGNING_STORE_PASSWORD') &&
            project.hasProperty('SIGNING_KEY_PASSWORD')

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(SIGNING_KEY_STORE_PATH)
                keyAlias SIGNING_KEY_ALIAS
                storePassword SIGNING_STORE_PASSWORD
                keyPassword SIGNING_KEY_PASSWORD
            }
        }
    }

    // Version convention: every commit that changes or fixes something bumps the
    // version by 0.1 (1.1 -> 1.2 -> ... -> 1.9 -> 2.0). Keep this in step with
    // the commit that ships the change.
    //
    // versionCode is DERIVED from versionName so the two can never drift and
    // versionCode is always monotonically increasing, as Android requires:
    //   1.1 -> 101, 1.2 -> 102, 1.10 -> 110, 2.0 -> 200
    def appVersionName = "1.14"
    def appVersionCode = appVersionName.tokenize('.').collect { it.padLeft(2, '0') }.join('') as int

    defaultConfig {
        applicationId "com.vivi.aharana"
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            // Local/dev builds get their own applicationId so they can be
            // installed side by side with the release (GitHub Actions) build
            // instead of replacing it. FileProvider authorities derive from
            // ${applicationId}, so they stay unique automatically.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        disable += "RemoveWorkManagerInitializer"
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        buildPython "/usr/bin/python3.12"
        pip {
            install "beautifulsoup4"
            install "chardet"
            install "html5lib"
            install "html2text"
            install "cloudscraper"
            install "requests"
            install "requests-file"
            install "urllib3"
            install "Brotli"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    def lifecycle_version = "2.8.0"
    def coroutines_version = "1.8.0"
    def room_version = "2.6.1"
    def work_version = "2.9.1"

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
}

repositories {
    google()
    maven { url = uri("https://repo1.maven.org/maven2/") }
    mavenCentral()
}
